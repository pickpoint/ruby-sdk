name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if release commit or already tagged
        id: guard
        run: |
          msg=$(git log -1 --pretty=%B)
          if echo "$msg" | grep -q '\[skip release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: commit has [skip release]"
            exit 0
          fi
          if git describe --exact-match --tags HEAD 2>/dev/null | grep -q '^v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: HEAD already tagged"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - if: steps.guard.outputs.skip != 'true'
        run: bundle exec rake test

      - name: Bump patch, commit, tag
        if: steps.guard.outputs.skip != 'true'
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ver=$(python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("VERSION")
          text = path.read_text().strip()
          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", text)
          if not m:
              raise SystemExit(f"invalid VERSION: {text!r}")
          major, minor, patch = map(int, m.groups())
          new = f"{major}.{minor}.{patch + 1}"
          path.write_text(new + "\n")
          print(new)
          PY
          )
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          git add VERSION
          git commit -m "chore: release v${ver} [skip release]"
          git tag "v${ver}"
          git push origin HEAD:main --follow-tags

      - name: Build gem
        if: steps.guard.outputs.skip != 'true'
        run: gem build pickpoint.gemspec

      - name: Publish to RubyGems
        if: steps.guard.outputs.skip != 'true'
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "${RUBYGEMS_API_KEY:-}" ]; then
            echo "RUBYGEMS_API_KEY not set — skip gem push"
            exit 0
          fi
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "$RUBYGEMS_API_KEY" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push pickpoint-*.gem

      - name: GitHub Release
        if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Verify tag matches VERSION
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(tr -d '[:space:]' < VERSION)
          if [ "$tag" != "$ver" ]; then
            echo "Tag v$tag != VERSION $ver"
            exit 1
          fi

      - run: bundle exec rake test
      - run: gem build pickpoint.gemspec

      - name: Publish to RubyGems
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "${RUBYGEMS_API_KEY:-}" ]; then
            echo "RUBYGEMS_API_KEY not set — skip gem push"
            exit 0
          fi
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "$RUBYGEMS_API_KEY" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push pickpoint-*.gem

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
